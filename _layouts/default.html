<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ site.baseurl }}/">home</a>
      <a href="{{ site.baseurl }}/posts/">posts</a>
    </nav>
  </header>
  <nav class="breadcrumb">
    {% if page.layout == "post" %}
      <a href="{{ site.baseurl }}/">home</a> / <a href="{{ site.baseurl }}/posts/">posts</a> / {{ page.title }}
    {% elsif page.url == "/posts/" %}
      <a href="{{ site.baseurl }}/">home</a> / posts
    {% else %}
      home
    {% endif %}
  </nav>
  {{ content }}
</body>
</html>
